[project]
name = "project-cluster"
version = "1.0.0"
description = "Unsupervised cardiometabolic phenotyping and sociodemographic disparity auditing on NHANES"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "joblib>=1.3.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
]

[project.scripts]
cardiometabolic-pheno = "project_cluster.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_cluster"]